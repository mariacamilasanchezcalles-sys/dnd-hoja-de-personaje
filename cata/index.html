<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cata</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Marcellus&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #060404;
    --panel: #171010;
    --panel-2: #1f1616;
    --lava: #ff3b1f;
    --lava-deep: #8a0e0e;
    --lava-glow: #ff6a3d;
    --ash: #2a2222;
    --ash-light: #4a3f3f;
    --text: #f2e6df;
    --text-dim: #a89791;
    --line: #332726;
    --ok: #7fae6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overflow-x:hidden;}
  body{min-height:100vh;}
  ::selection{background:var(--lava); color:#fff;}
  button{font-family:inherit;}

  #app{max-width:640px; margin:0 auto; min-height:100vh; position:relative;}

  .screen{display:none; min-height:100vh; padding-bottom:34px; animation:sweep .28s ease;}
  .screen.active{display:block;}
  @keyframes sweep{from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:none;}}

  /* ---------- HOME / HUB ---------- */
  #screen-home{padding:0;}
  .hero{
    position:relative; height:56vh; min-height:340px; display:flex; align-items:flex-end;
    background:
      linear-gradient(180deg, rgba(6,4,4,0.15) 0%, rgba(6,4,4,0.55) 55%, var(--bg) 100%),
      radial-gradient(ellipse at 30% 20%, rgba(255,59,31,0.35), transparent 60%),
      linear-gradient(160deg, #2a1210, #0d0707 70%);
  }
  .hero-portrait-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    color:var(--text-dim); font-size:12px; text-align:center; padding:20px;
  }
  .hero-portrait-empty .sigil{font-size:46px; opacity:.5; filter:drop-shadow(0 0 14px var(--lava));}
  .hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top;}
  .hero-title{position:relative; z-index:2; padding:20px 22px 22px; width:100%;}
  .hero-title .eyebrow{font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--lava-glow); font-weight:700; text-shadow:0 0 12px rgba(255,59,31,.6);}
  .hero-title h1{font-family:'Cinzel',serif; font-weight:900; font-size:42px; margin:2px 0 0; letter-spacing:.02em; text-shadow:0 0 24px rgba(255,59,31,.5), 0 2px 2px #000;}
  .hero-title .sub{font-family:'Marcellus',serif; font-style:italic; color:var(--text-dim); font-size:13px; margin-top:2px;}

  .hub-grid{padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .rune-btn{
    background:linear-gradient(150deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:16px; padding:20px 12px; text-align:center; cursor:pointer;
    color:var(--text); position:relative; overflow:hidden;
  }
  .rune-btn:active{transform:scale(.97);}
  .rune-btn::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, rgba(255,59,31,.16), transparent 70%); opacity:0; transition:opacity .2s;}
  .rune-btn:active::before{opacity:1;}
  .rune-btn .icon{font-size:26px; display:block; margin-bottom:8px; filter:drop-shadow(0 0 8px rgba(255,59,31,.5));}
  .rune-btn .label{font-family:'Cinzel',serif; font-size:13px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;}

  .combat-cta{
    margin:6px 18px 18px; padding:20px; border-radius:18px; text-align:center; cursor:pointer;
    background:linear-gradient(135deg, var(--lava-deep), var(--lava) 120%);
    border:1px solid var(--lava-glow);
    box-shadow:0 0 0 1px rgba(255,59,31,.2), 0 12px 30px rgba(255,59,31,.25);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,31,.35), 0 12px 30px rgba(255,59,31,.25);} 50%{box-shadow:0 0 0 10px rgba(255,59,31,0), 0 12px 30px rgba(255,59,31,.4);}}
  .combat-cta .label{font-family:'Cinzel',serif; font-weight:900; font-size:19px; letter-spacing:.08em; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.4);}
  .combat-cta .sub{font-size:11.5px; color:rgba(255,255,255,.85); margin-top:4px;}

  .mini-hp{display:flex; align-items:center; justify-content:space-between; padding:10px 18px; gap:10px;}
  .mini-hp .bar-wrap{flex:1; height:10px; background:var(--ash); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
  .mini-hp .bar-fill{height:100%; background:linear-gradient(90deg, var(--lava-deep), var(--lava-glow));}
  .mini-hp .txt{font-family:'Cinzel',serif; font-size:13px; color:var(--lava-glow); white-space:nowrap;}

  /* ---------- SUB SCREENS (shared) ---------- */
  .subheader{
    display:flex; align-items:center; gap:10px; padding:16px 16px 12px; position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--bg) 80%, transparent); backdrop-filter:blur(4px);
  }
  .back-btn{
    width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--lava-glow); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .subheader h2{font-family:'Cinzel',serif; font-size:19px; letter-spacing:.05em; margin:0; text-transform:uppercase;}
  .content{padding:0 16px 20px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .card h3{font-family:'Cinzel',serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--lava-glow); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .card h3 small{font-family:'Inter'; font-size:10.5px; text-transform:none; color:var(--text-dim); letter-spacing:0;}

  input, select, textarea{
    background:#0e0a0a; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 9px; font-size:14px; width:100%;
  }
  input:focus, textarea:focus{outline:1px solid var(--lava-glow); border-color:var(--lava-glow);}
  label{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px;}
  .field{margin-bottom:8px;}
  .row{display:flex; gap:8px; align-items:flex-end;}
  .row>*{flex:1;}

  button.btn{background:linear-gradient(135deg, var(--lava), var(--lava-deep)); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-weight:800; font-size:13px; cursor:pointer; letter-spacing:.02em;}
  button.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  button.btn.small{padding:7px 11px; font-size:12px;}
  button.btn.danger{background:#2a0e0e; border:1px solid var(--lava-deep); color:#ff9a8a;}
  button.btn.big{width:100%; padding:16px; font-size:15px; border-radius:14px;}

  /* ---------- STATS SCREEN ---------- */
  .ability-block{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
  .ability-head{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .ability-score{font-family:'Cinzel',serif; font-weight:900; font-size:38px; color:var(--lava-glow); text-shadow:0 0 16px rgba(255,106,61,.4); line-height:1;}
  .ability-name{font-family:'Cinzel',serif; font-size:14px; letter-spacing:.1em; text-transform:uppercase;}
  .ability-mod{font-size:13px; color:var(--text-dim);}
  .ability-save{margin-left:auto; text-align:right; font-size:11px; color:var(--text-dim);}
  .ability-save b{display:block; font-family:'Cinzel',serif; font-size:16px; color:var(--text);}
  .skill-list{display:grid; grid-template-columns:1fr auto; gap:6px 0; border-top:1px solid var(--line); padding-top:10px;}
  .skill-row{display:contents;}
  .skill-row span:first-child{font-size:13.5px; color:var(--text-dim); padding:3px 0;}
  .skill-row span:last-child{font-family:'Cinzel',serif; font-size:14px; color:var(--text); text-align:right;}

  /* ---------- WEAPONS ---------- */
  .weapon-card{border-radius:16px; overflow:hidden; border:1px solid var(--line); margin-bottom:14px; background:var(--panel);}
  .weapon-photo{height:130px; background:linear-gradient(150deg,#241414,#120a0a); display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer;}
  .weapon-photo img{width:100%; height:100%; object-fit:cover;}
  .weapon-photo .ph{color:var(--text-dim); font-size:11px; text-align:center;}
  .weapon-photo .ph .sigil{font-size:30px; display:block; margin-bottom:4px; opacity:.5;}
  .weapon-closed{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .weapon-closed .name{font-family:'Marcellus',serif; font-size:17px;}
  .weapon-closed .chev{color:var(--lava-glow); font-size:18px; transition:transform .2s;}
  .weapon-closed.open .chev{transform:rotate(90deg);}
  .weapon-detail{max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 16px;}
  .weapon-detail.open{max-height:600px; padding-bottom:16px;}
  .item-tags{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0;}
  .tag{font-size:10.5px; background:rgba(255,59,31,.14); border:1px solid var(--lava); color:var(--lava-glow); padding:2px 8px; border-radius:999px;}
  .item-stats{display:flex; gap:16px; font-size:13.5px; color:var(--text-dim); margin-top:4px;}
  .item-stats b{color:var(--text); font-family:'Cinzel',serif; font-size:16px;}

  /* ---------- COMBAT MODE ---------- */
  #screen-combat{background:radial-gradient(ellipse at 50% 0%, rgba(255,59,31,.14), var(--bg) 60%);}
  .combat-topbar{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line);}
  .combat-round{font-family:'Cinzel',serif; font-size:12px; color:var(--lava-glow); border:1px solid var(--lava-deep); border-radius:999px; padding:4px 12px; white-space:nowrap;}
  .combat-stats-mini{display:flex; gap:10px; padding:10px 16px; flex-wrap:wrap;}
  .mini-pill{background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12px; color:var(--text-dim); display:flex; gap:6px; align-items:center;}
  .mini-pill b{color:var(--lava-glow); font-family:'Cinzel',serif;}

  .combat-stage{padding:24px 20px; text-align:center;}
  .combat-question{font-family:'Cinzel',serif; font-size:16px; letter-spacing:.04em; color:var(--text-dim); margin-bottom:18px; text-transform:uppercase;}
  .combat-choices{display:flex; flex-direction:column; gap:12px;}
  .combat-choice-btn{
    background:linear-gradient(135deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:16px;
    padding:20px; font-family:'Cinzel',serif; font-size:16px; letter-spacing:.03em; color:var(--text); cursor:pointer;
  }
  .combat-choice-btn:active{transform:scale(.98);}
  .combat-choice-btn.used{opacity:.35; background:var(--ash);}
  .combat-choice-btn .status{display:block; font-family:'Inter'; font-size:11px; color:var(--lava-glow); margin-top:4px; font-weight:600; text-transform:none; letter-spacing:0;}

  .sub-choice-card{background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:left; margin-bottom:10px; cursor:pointer;}
  .sub-choice-card .name{font-family:'Marcellus',serif; font-size:16px;}
  .sub-choice-card .desc{font-size:12.5px; color:var(--text-dim); margin-top:4px;}

  .end-turn-bar{position:sticky; bottom:0; padding:16px; background:linear-gradient(transparent, var(--bg) 30%);}

  .empty-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:16px; border:1px dashed var(--line); border-radius:12px;}
  .note-uncertain{font-size:11px; color:#e8b34a; margin-top:6px; font-style:italic;}
  details.group summary{font-family:'Cinzel',serif; font-size:13px; letter-spacing:.05em; color:var(--lava-glow); cursor:pointer; padding:6px 0; list-style:none;}
  details.group summary::-webkit-details-marker{display:none;}
  details.group summary::before{content:"▸ ";}
  details.group[open] summary::before{content:"▾ ";}
  .item{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .item .name{font-family:'Marcellus',serif; font-size:15.5px;}
  .desc{font-size:13px; color:var(--text-dim); line-height:1.5; margin-top:4px;}

  .save-toast{position:fixed; bottom:14px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--lava-glow); color:#1a0700; font-weight:800; font-size:12px; padding:8px 16px; border-radius:999px; transition:all .25s; pointer-events:none; z-index:60;}
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Level up wizard */
  .wizard-step{display:none;}
  .wizard-step.active{display:block;}
  .wizard-progress{display:flex; gap:6px; padding:0 16px 12px;}
  .wizard-progress span{flex:1; height:4px; border-radius:999px; background:var(--ash);}
  .wizard-progress span.done{background:var(--lava-glow);}
  .wizard-nav{display:flex; gap:10px; padding:16px;}

  @media (min-width: 900px){
    body{background:radial-gradient(ellipse at 50% -10%, rgba(255,59,31,.16), var(--bg) 55%);}
    #app{max-width:1180px; padding:24px 28px 40px;}
    .screen{min-height:auto;}
    #screen-home.active{display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(320px, .75fr); gap:20px; align-items:start;}
    #screen-home .hero{grid-column:1 / -1; height:380px; min-height:0; border:1px solid var(--line); border-radius:18px; overflow:hidden;}
    #screen-home .mini-hp{grid-column:1; padding:16px 0 0;}
    #screen-home .row{grid-column:1; padding:0 0 4px !important;}
    #screen-home .hub-grid{grid-column:1; padding:0; grid-template-columns:repeat(3, 1fr);}
    #screen-home .hub-grid .rune-btn:last-child{grid-column:1 / -1;}
    #screen-home .combat-cta{grid-column:2; grid-row:2 / span 3; margin:0; min-height:180px; display:flex; flex-direction:column; justify-content:center;}
    .screen:not(#screen-home){max-width:1080px; margin:0 auto;}
    .content{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; padding:0;}
    .content > .card, .content > .ability-block, .content > .weapon-card{margin-bottom:0;}
    .content > .card:last-child, .content > .btn{grid-column:1 / -1;}
    .subheader{padding:10px 0 18px; position:relative; background:transparent;}
    .combat-stage{max-width:760px; margin:0 auto;}
    #screen-combat .card{max-width:760px; margin-left:auto; margin-right:auto;}
    .combat-choices{display:grid; grid-template-columns:repeat(3, 1fr);}
  }
</style>
</head>

let state = null;

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

async function loadState(){
  try{
    const stored = window.storage
      ? await window.storage.get(STORAGE_KEY, false)
      : {value: window.localStorage.getItem(STORAGE_KEY)};
    if(stored && stored.value){
      state = Object.assign(deepClone(DEFAULT_STATE), JSON.parse(stored.value));
      state.combat = Object.assign(deepClone(DEFAULT_STATE.combat), state.combat||{});
      migrateState();
    } else {
      state = deepClone(DEFAULT_STATE);
      await saveState(true);
    }
  } catch(e){ state = deepClone(DEFAULT_STATE); }
  render();
}

function migrateState(){
  const v = state.dataVersion || 1;
  if(v < 2){
    // fix stale invocation
    const inv6 = state.invocations && state.invocations.find(i=>i.id==='i6');
    if(inv6 && inv6.name && inv6.name.indexOf('Pacto de la Cadena')===0){
      const fresh = DEFAULT_STATE.invocations.find(i=>i.id==='i6');
      inv6.name = fresh.name; inv6.desc = fresh.desc;
    } else if(!inv6){
      state.invocations.push(deepClone(DEFAULT_STATE.invocations.find(i=>i.id==='i6')));
    }
    // add missing cantrips/spells introduced later
    ['c5','c6','c7'].forEach(id=>{
      if(!state.cantrips.find(c=>c.id===id)) state.cantrips.push(deepClone(DEFAULT_STATE.cantrips.find(c=>c.id===id)));
    });
    if(!state.spells.find(s=>s.id==='s19')) state.spells.push(deepClone(DEFAULT_STATE.spells.find(s=>s.id==='s19')));
    if(!state.important) state.important = deepClone(DEFAULT_STATE.important);
    // migrate old feats ft2/ft3 into originFeatOptions, remove from standalone feats
    if(!state.originFeatOptions) state.originFeatOptions = deepClone(DEFAULT_STATE.originFeatOptions);
    if(state.feats) state.feats = state.feats.filter(f=>f.id!=='ft2' && f.id!=='ft3');
  }
  if(v < 3){
    // Carisma subió a 18 (+4): si el jugador no la cambió manualmente desde entonces, refresca CHA y el arma vinculada
    if(state.abilities && state.abilities.cha && state.abilities.cha.score===17){
      state.abilities.cha = deepClone(DEFAULT_STATE.abilities.cha);
    }
    const bondedMelon = state.weapons && state.weapons.find(w=>w.id==='w2');
    if(bondedMelon && bondedMelon.atkBonus==='+6'){
      bondedMelon.atkBonus='+7'; bondedMelon.dmgMod='+4';
      bondedMelon.note='Vinculada por Pacto de Filo — Carisma (+4) + competencia (+3)';
    }
  }
  if(v < 4){
    if(!state.portraitImage){ state.portraitImage = DEFAULT_STATE.portraitImage; }
  }
  if(v < 5){
    const m1 = state.weapons && state.weapons.find(w=>w.id==='w2');
    const m2 = state.weapons && state.weapons.find(w=>w.id==='w3');
    if(m1 && m2){
      m1.pairWith = 'w3'; m2.pairWith = 'w2';
      if(!m1.img) m1.img = DEFAULT_STATE.weapons.find(w=>w.id==='w2').img;
      if(!m2.img) m2.img = DEFAULT_STATE.weapons.find(w=>w.id==='w3').img;
    }
  }
  state.dataVersion = 5;
  saveState(true);
}
let saveTimer=null;
async function saveState(silent){
  try{
    const value = JSON.stringify(state);
    if(window.storage) await window.storage.set(STORAGE_KEY, value, false);
    else window.localStorage.setItem(STORAGE_KEY, value);
    if(!silent) showToast();
  }
  catch(e){ console.error(e); }
}
function showToast(){
  const t=document.getElementById('toast'); t.classList.add('show');
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>t.classList.remove('show'),900);
}

function spellAtkBonus(){ return profBonus(totalLevel()) + state.abilities.cha.mod; }
function spellDC(){ return 8 + profBonus(totalLevel()) + state.abilities.cha.mod; }
function statTag(save){
  if(!save) return '';
  if(save.indexOf('Ataque de conjuro')===0) return `+${spellAtkBonus()} al ataque`;
  if(save.indexOf('Salvación')===0) return `DC ${spellDC()}`;
  return '';
}
function describeRoll(save){
  if(!save) return '';
  if(save.indexOf('Ataque de conjuro')===0) return `🎲 Tú tiras: ataque de conjuro +${spellAtkBonus()} contra su CA`;
  if(save.indexOf('Sin salvación')===0) return '✅ Sin tirada de salvación';
  if(save.indexOf('⚠️')===0) return '⚠️ Sin confirmar quién tira';
  if(save.indexOf('Salvación')===0) return `🎲 El objetivo tira: ${save} (tu DC ${spellDC()})`;
  return save;
}

/* ================= EVENTS ================= */
function bindEvents(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goto(b.dataset.goto));

  // stats screen has no direct inputs to bind besides nav (read-only display + edit via other means could be added later)

  // cantrips edit/delete/add
  document.querySelectorAll('[data-edit-cantrip]').forEach(b=>b.onclick=()=>{
    document.getElementById('edit-cantrip-'+b.dataset.editCantrip).style.display='block';
  });
  document.querySelectorAll('[data-close-cantrip]').forEach(b=>b.onclick=()=>{ saveState(); render(); });
  document.querySelectorAll('[data-del-cantrip]').forEach(b=>b.onclick=()=>{
    if(!confirm('¿Eliminar este truco?')) return;
    state.cantrips = state.cantrips.filter(c=>c.id!==b.dataset.delCantrip);
    saveState(); render();
  });
  document.querySelectorAll('[data-c]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = state.cantrips.find(x=>x.id===inp.dataset.c);
      if(c){ c[inp.dataset.f] = inp.value; saveState(true); }
    });
  });
  const addCantripBtn = document.getElementById('addCantripBtn');
  if(addCantripBtn) addCantripBtn.onclick = ()=>{
    const id = 'c'+Date.now();
    state.cantrips.push({id, name:'Nuevo truco', bonus:'', save:'Sin salvación', dmg:'—', extra:'', desc:'Toca "editar" para completar los detalles.'});
    openWeapon = null;
    saveState(); render();
    const el = document.getElementById('edit-cantrip-'+id);
    if(el) el.style.display='block';
  };

  // spells edit/delete/add
  document.querySelectorAll('[data-edit-spell]').forEach(b=>b.onclick=()=>{
    document.getElementById('edit-spell-'+b.dataset.editSpell).style.display='block';
  });
  document.querySelectorAll('[data-close-spell]').forEach(b=>b.onclick=()=>{ saveState(); render(); });
  document.querySelectorAll('[data-del-spell]').forEach(b=>b.onclick=()=>{
    if(!confirm('¿Eliminar este conjuro?')) return;
    state.spells = state.spells.filter(s=>s.id!==b.dataset.delSpell);
    saveState(); render();
  });
  document.querySelectorAll('[data-s]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const s = state.spells.find(x=>x.id===inp.dataset.s);
      if(!s) return;
      if(inp.dataset.f==='level'){ s.level = parseInt(inp.value)||1; }
      else { s[inp.dataset.f] = inp.value; }
      saveState(true);
    });
  });
  const addSpellBtn = document.getElementById('addSpellBtn');
  if(addSpellBtn) addSpellBtn.onclick = ()=>{
    const id = 's'+Date.now();
    state.spells.push({id, name:'Nuevo conjuro', level:1, source:'Personalizado', dc:'', save:'Sin salvación', dmg:'—', desc:'Toca "editar" para completar los detalles.'});
    saveState(); render();
    const el = document.getElementById('edit-spell-'+id);
    if(el) el.style.display='block';
  };
  const importSpell = document.getElementById('importSpell');
  if(importSpell) importSpell.onclick = ()=>{
    const selected = CATA_CATALOG.spells.find(s=>s.id===document.getElementById('catalogSpell').value);
    if(!selected) return;
    state.spells.push({...deepClone(selected), id:'s'+Date.now()});
    saveState(); render();
  };

  const importFeat = document.getElementById('importFeat');
  if(importFeat) importFeat.onclick = ()=>{
    const selected = CATA_CATALOG.feats.find(f=>f.id===document.getElementById('catalogFeat').value);
    if(!selected) return;
    state.feats.push({...deepClone(selected), id:'ft'+Date.now()});
    saveState(); render();
  };

  // weapons
  document.querySelectorAll('[data-toggle-weapon]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggleWeapon;
    openWeapon = openWeapon===id? null : id;
    render();
  });
  document.querySelectorAll('[data-edit-weapon]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    document.getElementById('edit-weapon-'+b.dataset.editWeapon).style.display='block';
  });
  document.querySelectorAll('[data-w]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const w = state.weapons.find(x=>x.id===inp.dataset.w);
      if(w){ w[inp.dataset.f] = inp.value; saveState(true); }
    });
    inp.addEventListener('click', e=>e.stopPropagation());
  });
  const addWeaponBtn = document.getElementById('addWeapon');
  if(addWeaponBtn) addWeaponBtn.onclick = ()=>{
    state.weapons.push({id:'w'+Date.now(), name:'Nueva arma', type:'', bonded:false, atk:'', dmg:'', props:'', note:'', img:null});
    saveState(); render();
  };

  // inventory
  const goldInput = document.getElementById('goldInput');
  if(goldInput) goldInput.onchange = e=>{ state.gold=parseInt(e.target.value)||0; saveState(); };
  document.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=()=>{ state.inventory=state.inventory.filter(i=>i.id!==b.dataset.delItem); saveState(); render(); });
  const addItemBtn = document.getElementById('addItem');
  if(addItemBtn) addItemBtn.onclick = ()=>{
    const inp = document.getElementById('newItemInput'); const name=(inp.value||'').trim();
    if(!name) return; state.inventory.push({id:'e'+Date.now(), name}); saveState(); render();
  };

  // level up wizard
  const wzNext = document.getElementById('wzNext');
  const wzBack = document.getElementById('wzBack');
  if(wzBack) wzBack.onclick = ()=>{ wizardStep=Math.max(0,wizardStep-1); render(); };
  if(wzNext) wzNext.onclick = ()=>{
    if(wizardStep===0){
      wizardDraft.fighterLevel = parseInt(document.getElementById('wzFighter').value)||state.fighterLevel;
      wizardDraft.warlockLevel = parseInt(document.getElementById('wzWarlock').value)||state.warlockLevel;
    } else if(wizardStep===1){
      wizardDraft.hpGain = parseInt(document.getElementById('wzHpGain').value)||0;
      wizardDraft.ability = document.getElementById('wzAbility').value;
    } else if(wizardStep===2){
      wizardDraft.invocation = CATA_CATALOG.invocations.find(i=>i.id===document.getElementById('wzInvocation').value);
      wizardDraft.feat = CATA_CATALOG.feats.find(i=>i.id===document.getElementById('wzFeat').value);
      wizardDraft.spell = CATA_CATALOG.spells.find(i=>i.id===document.getElementById('wzSpell').value);
      wizardDraft.feature = CATA_CATALOG.classFeatures.find(i=>i.id===document.getElementById('wzFeature').value);
    }
    if(wizardStep<3){
      wizardStep++;
      if(wizardStep===3){
        render();
        document.getElementById('wzSummary').innerHTML = `
          Guerrero ${wizardDraft.fighterLevel} / Brujo ${wizardDraft.warlockLevel}<br>
          PG máximos: ${state.hpMax} → ${state.hpMax+(wizardDraft.hpGain||0)}<br>
          ${wizardDraft.ability?('Mejora: '+wizardDraft.ability+' +1<br>'):''}
          ${wizardDraft.invocation?('Nueva invocación: '+wizardDraft.invocation.name+'<br>'):''}
          ${wizardDraft.feat?('Nuevo dote: '+wizardDraft.feat.name+'<br>'):''}
          ${wizardDraft.spell?('Nuevo conjuro: '+wizardDraft.spell.name+'<br>'):''}
          ${wizardDraft.feature?('Nuevo rasgo: '+wizardDraft.feature.name+'<br>'):''}
        `;
        return;
      }
      render();
    } else {
      // apply
      state.fighterLevel = wizardDraft.fighterLevel;
      state.warlockLevel = wizardDraft.warlockLevel;
      state.hpMax += (wizardDraft.hpGain||0);
      state.hpCurrent += (wizardDraft.hpGain||0);
      if(wizardDraft.ability){
        const ability = state.abilities[wizardDraft.ability];
        ability.score += 1;
        ability.mod = Math.floor((ability.score - 10) / 2);
      }
      if(wizardDraft.invocation) state.invocations.push({...deepClone(wizardDraft.invocation), id:'i'+Date.now()});
      if(wizardDraft.feat) state.feats.push({...deepClone(wizardDraft.feat), id:'ft'+Date.now()});
      if(wizardDraft.spell) state.spells.push({...deepClone(wizardDraft.spell), id:'s'+Date.now()});
      if(wizardDraft.feature) state.classFeatures.push({...deepClone(wizardDraft.feature), id:'cf'+Date.now()});
      wizardStep=0; wizardDraft={};
      saveState(); goto('home');
    }
  };

  // combat mode
  const startCombat = document.getElementById('startCombat');
  if(startCombat) startCombat.onclick = ()=>{
    const init = parseInt(document.getElementById('initInput').value)||0;
    state.combat = {active:true, initiative:init, round:1, actionUsed:false, actionChoice:null, bonusUsed:false, bonusChoice:null, reactionUsed:false, reactionChoice:null, stage:'main'};
    saveState(); render();
  };
  document.querySelectorAll('[data-combat]').forEach(b=>b.onclick=()=>{
    const type = b.dataset.combat;
    const used = {action:'actionUsed', bonus:'bonusUsed', reaction:'reactionUsed'}[type];
    if(state.combat[used]) return; // already used, ignore
    state.combat.stage = type;
    saveState(true); render();
  });
  const cancelStage = document.getElementById('cancelStage');
  if(cancelStage) cancelStage.onclick = ()=>{ state.combat.stage='main'; render(); };
  const cancelToAction = document.getElementById('cancelToAction');
  if(cancelToAction) cancelToAction.onclick = ()=>{ state.combat.stage='action'; render(); };

  document.querySelectorAll('[data-stage-goto]').forEach(el=>el.onclick=()=>{
    state.combat.stage = el.dataset.stageGoto;
    saveState(true); render();
  });

  document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{
    const [type, label] = el.dataset.choice.split(':');
    const usedKey = {action:'actionUsed', bonus:'bonusUsed', reaction:'reactionUsed'}[type];
    const choiceKey = {action:'actionChoice', bonus:'bonusChoice', reaction:'reactionChoice'}[type];
    state.combat[usedKey] = true;
    state.combat[choiceKey] = label;
    if(type==='bonus' && label==='Tomar Aliento'){ state.secondWindUsed = Math.min(2, (state.secondWindUsed||0)+1); }
    if(type==='action' && label.indexOf('Castigo Arcano')===0){
      const [max] = warlockSlots(state.warlockLevel);
      state.spellSlotsUsed = Math.min(max, state.spellSlotsUsed+1);
    }
    state.combat.stage = 'main';
    saveState(true); render();
  });

  document.querySelectorAll('[data-cast]').forEach(el=>el.onclick=()=>{
    const [kind, id] = el.dataset.cast.split(':');
    let label = '';
    if(kind==='spell'){
      const s = state.spells.find(x=>x.id===id);
      label = s.name;
      if(!s.source.includes('Racial')){
        const [max] = warlockSlots(state.warlockLevel);
        state.spellSlotsUsed = Math.min(max, state.spellSlotsUsed+1);
      }
    } else {
      const cn = state.cantrips.find(x=>x.id===id);
      label = cn.name;
    }
    state.combat.actionUsed = true;
    state.combat.actionChoice = label;
    state.combat.stage = 'main';
    saveState(true); render();
  });

  const combatDamage = document.getElementById('combatDamage');
  const combatHeal = document.getElementById('combatHeal');
  const combatHpDelta = document.getElementById('combatHpDelta');
  if(combatDamage) combatDamage.onclick = ()=>{
    let amt = parseInt(combatHpDelta.value)||0;
    if(amt<=0) return;
    if(state.tempHp>0){ const absorbed=Math.min(state.tempHp,amt); state.tempHp-=absorbed; amt-=absorbed; }
    state.hpCurrent = Math.max(0, state.hpCurrent-amt);
    combatHpDelta.value=''; saveState(); render();
  };
  if(combatHeal) combatHeal.onclick = ()=>{
    const amt = parseInt(combatHpDelta.value)||0;
    state.hpCurrent = Math.min(state.hpMax, state.hpCurrent+amt);
    combatHpDelta.value=''; saveState(); render();
  };

  const addImportant = document.getElementById('addImportant');
  if(addImportant) addImportant.onclick = ()=>{
    const name = prompt('¿Qué quieres recordar?'); if(!name) return;
    const desc = prompt('Detalle breve:','')||'';
    state.important.push({id:'imp'+Date.now(), name, desc});
    saveState(); render();
  };
  document.querySelectorAll('[data-del-important]').forEach(b=>b.onclick=()=>{
    state.important = state.important.filter(i=>i.id!==b.dataset.delImportant);
    saveState(); render();
  });

  const restShort = document.getElementById('restShort');
  if(restShort) restShort.onclick = ()=>{
    state.spellSlotsUsed = 0;
    state.secondWindUsed = 0;
    saveState(); render();
  };
  const restLong = document.getElementById('restLong');
  if(restLong) restLong.onclick = ()=>{
    state.spellSlotsUsed = 0;
    state.hpCurrent = state.hpMax;
    saveState(); render();
  };
  const endTurn = document.getElementById('endTurn');
  if(endTurn) endTurn.onclick = ()=>{
    state.combat.round += 1;
    state.combat.actionUsed=false; state.combat.actionChoice=null;
    state.combat.bonusUsed=false; state.combat.bonusChoice=null;
    state.combat.reactionUsed=false; state.combat.reactionChoice=null;
    saveState(); render();
  };
  const exitCombat = document.getElementById('exitCombat');
  if(exitCombat) exitCombat.onclick = ()=>{ state.combat.active=false; saveState(); goto('home'); };
}

loadState();
</script>
</body>
</html>
